name: Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the CLI once; the Python integration tests shell out to it. Sharing
  # a single artifact avoids rebuilding the (LTO) release binary per Python
  # version in the matrix below.
  build-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build bacha binary
      run: cargo build --release
    - uses: actions/upload-artifact@v4
      with:
        name: bacha-cli
        path: target/release/bacha
        if-no-files-found: error

  test:
    needs: build-cli
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Download bacha binary
      uses: actions/download-artifact@v4
      with:
        name: bacha-cli
        path: bin
    - name: Put bacha on PATH
      run: |
        chmod +x bin/bacha
        echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e "./bacha-py[test]"
    - name: Run tests
      working-directory: bacha-py
      run: pytest -v
