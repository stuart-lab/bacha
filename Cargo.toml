[package]
name = "bacha"
description = "Bias-adjusted aggregation of chromatin accessibility data"
version = "1.0.0"
edition = "2021"
authors = ["Tim Stuart <stuartt@a-star.edu.sg>", "Ting Wei Lim <Lim_Ting_Wei@a-star.edu.sg>"]
license = "MIT"
repository = "https://github.com/stuart-lab/bacha"
documentation = ""
readme = "README.md"

[dependencies]
clap = { version = "4.1", features = ["derive"] }
flate2 = { version = "1.0.30", features = ["zlib-ng-compat"], default-features = false }
gzp = "0.11.3"
xz2 = "0.1"
log = "0.4.22"
pretty_env_logger = "0.5.0"
rust-lapper = "1.1.0"
rustc-hash = "2.0.0"
tikv-jemallocator = "0.5"
ndarray = "0.16"
rayon = "1.10.0"
smallvec = "1.15.1"
lexical-core = "1.0.6"
libc = "0.2"
crossbeam-channel = "0.5"
noodles-bgzf = "0.42"
bio = "2"
rand = "0.8"
rand_distr = "0.4"
nalgebra = "0.33"
kiddo = "5"
hdf5 = { version = "0.10", package = "hdf5-metno", features = ["static"] }

[dev-dependencies]
clap-markdown = "0.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
